[workspace]
resolver = "3"
members = ["crates/modelview-core", "crates/modelview-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
glam = "0.34"
rayon = "1.11"
roxmltree = "0.21"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
